name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable by publish.yml so a release is gated by this exact matrix run
  # against the tag being published, not by a weaker private copy of it.
  workflow_call:

jobs:
  # Gates every dependency (lockfile, dev included) against the permissive
  # license allowlist; publish.yml reuses this workflow, so a release is gated too.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check:licenses

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Keep CI on the declared runtime minimum across supported operating systems.
        node-version: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
