name: Publish to npm

on:
  release:
    types: [published]

jobs:
  # The reusable full matrix (3 OSes x Node 18.19.0/20/22/24) runs against the
  # tag being published; a failure on any supported environment blocks the
  # publish job below.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Releases are deliberately immutable: the tag, package.json, and the
      # version embedded in the installed cah bins must already agree.
      - name: Validate release version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Refusing to publish: tag '${GITHUB_REF_NAME}' is not a semver vMAJOR.MINOR.PATCH[-prerelease] tag." >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CURRENT_VERSION="$(node --input-type=module -e "import { CURRENT_VERSION } from './lib/update-check.js'; console.log(CURRENT_VERSION)")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" || "$VERSION" != "$CURRENT_VERSION" ]]; then
            echo "Refusing to publish: tag=$VERSION package=$PACKAGE_VERSION CURRENT_VERSION=$CURRENT_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # Smoke-install exactly what would be published: pack the tarball,
      # install it globally, and run the CLI end-to-end against an isolated
      # HOME before the real publish step.
      - name: Smoke-install the packed tarball
        env:
          SMOKE_HOME: ${{ runner.temp }}/cah-smoke-home
        run: |
          mkdir -p "$SMOKE_HOME"
          npm pack --pack-destination "$RUNNER_TEMP"
          TARBALL="$RUNNER_TEMP/cc-arch-hands-$VERSION.tgz"
          npm install -g "$TARBALL"
          export HOME="$SMOKE_HOME" USERPROFILE="$SMOKE_HOME"
          cah install
          cah doctor
          cah list
          cah uninstall
      - name: Publish package
        run: |
          if [[ "$VERSION" == *-* ]]; then
            # Never move a prerelease onto npm's default latest dist-tag.
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
